
name: Build and SonarQube Analysisssssss

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Build and Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate SonarQube configuration
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SONAR_HOST_URL:-}" ]]; then
            echo "::error::SONAR_HOST_URL secret is missing"
            exit 1
          fi

          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error::SONAR_TOKEN secret is missing"
            exit 1
          fi

          # Remove accidental surrounding whitespace.
          SONAR_HOST_URL="$(printf '%s' "$SONAR_HOST_URL" |
            sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

          # Remove trailing slash characters.
          SONAR_HOST_URL="${SONAR_HOST_URL%/}"

          if [[ ! "$SONAR_HOST_URL" =~ ^https?://[^/[:space:]]+(:[0-9]+)?$ ]]; then
            echo "::error::SONAR_HOST_URL must be a valid base URL"
            exit 1
          fi

          echo "SONAR_HOST_URL=$SONAR_HOST_URL" >> "$GITHUB_ENV"

      - name: Verify SonarQube server
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            -o "$response_file" \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/system/status")

          if [[ "$http_code" != "200" ]]; then
            echo "::error::SonarQube status request returned HTTP $http_code"
            cat "$response_file"
            exit 1
          fi

          cat "$response_file"
          echo

          if ! grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' "$response_file"; then
            echo "::error::SonarQube is reachable but is not UP"
            exit 1
          fi

      - name: Set up SonarScanner CLI
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .

      - name: Analysis completed
        if: success()
        run: echo "SonarQube analysis submitted successfully."
